<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Economia</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>💰 IA Economia</h1>

<h2>Dados Financeiros</h2>

<input type="number" id="salario" placeholder="Quanto você ganha por mês?">

<input type="number" id="gastoPrincipal" placeholder="Quanto gasta com sua principal despesa?">

<input type="number" id="objetivo" placeholder="Quanto deseja economizar por mês?">

<input type="number" id="rendaAnual" placeholder="Renda anual">

<input type="number" id="despesas" placeholder="Despesas mensais totais">

<button onclick="analisarFinancas()">
Analisar Situação
</button>

<div id="resultado"></div>

<hr>

<h2>Consultor Financeiro</h2>

<textarea
id="relato"
rows="6"
placeholder="Ex: Estou gastando muito com alimentação porque viajei bastante este mês.">
</textarea>

<button onclick="consultorIA()">
Receber Orientação
</button>

<div id="consultoria"></div>

</div>

<script src="script.js"></script>

</body>
</html>
